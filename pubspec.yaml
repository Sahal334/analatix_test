name: analatix_flutter_test_muhammedsahal
description: "Analytix Product Catalogue App - Flutter Developer Technical Assignment"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Networking
  dio: ^5.8.0+1

  # Secure Storage
  flutter_secure_storage: ^9.2.4

  # Local Database / Cache (Offline + Favourites)
  hive_flutter: ^1.1.0

  # QR Scanner
  mobile_scanner: ^6.0.4

  # Image caching
  cached_network_image: ^3.4.1

  # Connectivity
  connectivity_plus: ^6.1.4

  # Intl / l10n
  intl: ^0.20.2

  # Icons & UI helpers
  cupertino_icons: ^1.0.8
  local_auth: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4
  fake_async: ^1.3.1

flutter:
  uses-material-design: true
  generate: true
